plugins { id 'com.android.application' }

android {
    namespace 'online.globus.news'
    compileSdk 35
    testBuildType 'release'
    defaultConfig {
        applicationId 'online.globus.news'
        minSdk 23
        targetSdk 35
        versionCode 6
        versionName '1.4.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        release {
            if (System.getenv('GLOBUS_KEYSTORE')) {
                storeFile file(System.getenv('GLOBUS_KEYSTORE'))
                storePassword System.getenv('GLOBUS_KEYSTORE_PASSWORD')
                keyAlias 'globus'
                keyPassword System.getenv('GLOBUS_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
    sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'junit:junit:4.13.2'
}
