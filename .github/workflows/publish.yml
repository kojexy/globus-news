name: Refresh news and publish website
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README.md', 'scripts/translation-cache.json', 'web/data/**']
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: globus-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_CHUNK_TYPE: MINISBD
      ARGOS_BEAM_SIZE: '2'
      ARGOS_INTRA_THREADS: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Test reader and RSS parser
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Restore translation models
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.cache/argos-translate
            ~/.local/cache/argos-translate
            ~/stanza_resources
          key: argos-1.11-en-ru-cpu-minisbd-v1
      - name: Install CPU translation engine
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r scripts/requirements.txt
      - name: Collect current RSS and translate to Russian
        run: python scripts/collect_news.py
      - name: Keep the last successful edition
        run: |
          git config user.name "globus-news[bot]"
          git config user.email "globus-news[bot]@users.noreply.github.com"
          git add web/data/news.json scripts/translation-cache.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh translated news edition"
            git push origin HEAD:main
          fi
      - name: Build website
        run: python scripts/build_web.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
