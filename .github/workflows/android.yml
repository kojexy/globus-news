name: Build Android TV APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', '!web/data/**', 'scripts/build_web.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globus-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle offline reader with live feed URL
        env:
          GLOBUS_FEED_URL: https://kojexy.github.io/globus-news/data/news.json
        run: |
          python3 scripts/build_web.py
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/
      - name: Restore release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.GLOBUS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Release signing secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/globus.jks"
      - name: Build signed release
        working-directory: android
        env:
          GLOBUS_KEYSTORE: ${{ runner.temp }}/globus.jks
          GLOBUS_KEYSTORE_PASSWORD: ${{ secrets.GLOBUS_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease assembleReleaseAndroidTest
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk globus-news.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test app on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/smoke_android_release.py
      - name: Upload Android screenshots and accessibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-smoke-evidence
          path: work/android-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: globus-news-android-tv
          path: globus-news.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "Глобус — Android TV" --notes "Установите globus-news.apk на Android TV / Google TV (Android 6 или новее, актуальный Android System WebView). Исходники и сборка находятся в этом репозитории. Платные API и Android Studio не нужны." --latest
          fi
          gh release upload android-latest globus-news.apk --clobber
