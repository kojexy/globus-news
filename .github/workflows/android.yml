name: Build Android TV APK
on:
  push:
    branches: [main]
    paths: ['android/**', 'web/**', '!web/data/**', 'scripts/build_web.py', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: globus-android
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install build platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Bundle offline reader with live feed URL
        env:
          GLOBUS_FEED_URL: https://kojexy.github.io/globus-news/data/news.json
        run: |
          python3 scripts/build_web.py
          mkdir -p android/app/src/main/assets/web
          cp -R dist/. android/app/src/main/assets/web/
      - name: Restore release signing identity
        env:
          KEYSTORE_BASE64: ${{ secrets.GLOBUS_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Release signing secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/globus.jks"
      - name: Build signed release
        working-directory: android
        env:
          GLOBUS_KEYSTORE: ${{ runner.temp }}/globus.jks
          GLOBUS_KEYSTORE_PASSWORD: ${{ secrets.GLOBUS_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk globus-news.apk
      - uses: actions/upload-artifact@v4
        with:
          name: globus-news-android-tv
          path: globus-news.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view android-latest >/dev/null 2>&1; then
            gh release create android-latest --title "Глобус — Android TV" --notes "Установите globus-news.apk на Android TV / Google TV (Android 6 или новее, актуальный Android System WebView). Исходники и сборка находятся в этом репозитории. Платные API и Android Studio не нужны." --latest
          fi
          gh release upload android-latest globus-news.apk --clobber
